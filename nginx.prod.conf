# 1. Обработка HTTP (Порт 80) — Перенаправление на HTTPS и проверка Certbot
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com ://yourdomain.com;

    # Специальная папка, через которую Certbot доказывает, что вы владеете доменом
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Всех остальных пользователей принудительно перекидываем на защищенный HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Обработка HTTPS (Порт 443) — Защищенное проксирование во Flask
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name yourdomain.com ://yourdomain.com;

    # Пути к сертификатам, которые сгенерирует Certbot
    ssl_certificate /etc/letsencrypt/live/://yourdomain.com;
    ssl_certificate_key /etc/letsencrypt/live/://yourdomain.com;

    # Рекомендуемые настройки безопасности для SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass http://web:5000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 90s;
        proxy_read_timeout 90s;
    }
}
