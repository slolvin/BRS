{% extends 'base.html' %}
{% block title %}Регистрация Менеджера{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            
            <div class="card border-0 rounded-4 shadow-sm bg-body-tertiary p-4">
                <h2 class="text-white fw-bold mb-1 text-uppercase tracking-wide fs-5">Создать Менеджера</h2>
                <p class="text-secondary small mb-4">Регистрация нового управляющего заведениями в системе БРС</p>
                
                <!-- Экшен формы шлет данные на наш новый защищенный роут -->
                <form action="{{ url_for('auth.register_manager') }}" method="POST" class="d-flex flex-column gap-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div>
                        <label for="email" class="form-label small text-secondary fw-medium">Email адрес</label>
                        <input type="email" class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white" id="email" name="email" required>
                    </div>

                    <div>
                        <label for="username" class="form-label small text-secondary fw-medium">Имя пользователя (Никнейм)</label>
                        <input type="text" class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white" id="username" name="username" required>
                    </div>

                    <div>
                        <label for="password" class="form-label small text-secondary fw-medium">Временный пароль</label>
                        <input type="password" class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn btn-purple w-100 py-2 mt-2 text-uppercase tracking-wider fw-medium">
                        <i class="bi bi-shield-plus me-1"></i> Зарегистрировать управляющего
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
