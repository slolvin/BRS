{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <div class="card border-0 rounded-4 shadow bg-body-tertiary overflow-hidden w-100" style="max-width: 1050px;">
          <div class="row g-0 align-items-center">
              <div class="col-12 col-lg-5 p-4 p-sm-5 order-2 order-lg-1">
                  <div class="mb-4">
                      <h2 class="h3 fw-bold text-white text-uppercase tracking-wider mb-1">Регистрация</h2>
                      <p class="text-secondary small">Создайте аккаунт эксперта для оценки баров</p>
                  </div>
                  <form action="{{ url_for('auth.register') }}" method="post" class="row g-3">
                      <div class="col-12">
                          <label for="formUsername" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Имя пользователя (Никнейм)</label>
                          <div class="input-group">
                              <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                  <i class="bi bi-person"></i>
                              </span>
                              <input name="username" type="text" id="formUsername"
                                     class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                     placeholder="Username" required>
                          </div>
                      </div>
                      <div class="col-12">
                          <label for="formEmail" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Электронная почта</label>
                          <div class="input-group">
                              <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                  <i class="bi bi-envelope"></i>
                              </span>
                              <input name="email" type="email" id="formEmail"
                                     class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                     placeholder="example@mail.com" required>
                          </div>
                      </div>
                      <div class="col-12">
                          <label for="formPassword" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Пароль</label>
                          <div class="input-group">
                              <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                  <i class="bi bi-lock"></i>
                              </span>
                              <input name="password" type="password" id="formPassword"
                                     class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                     placeholder="••••••••" required>
                          </div>
                      </div>
                      <div class="col-12">
                          <label for="formPassword2" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Повторите пароль</label>
                          <div class="input-group">
                              <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                  <i class="bi bi-key"></i>
                              </span>
                              <input name="password2" type="password" id="formPassword2"
                                     class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                     placeholder="••••••••" required>
                          </div>
                      </div>
                      <div class="col-12 pt-2">
                          <button class="btn btn-primary btn-lg w-100 fw-medium text-uppercase tracking-wide py-2.5 fs-6 shadow-sm" type="submit">
                              Зарегистрироваться
                          </button>
                      </div>
                      <div class="col-12 text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                          <span class="text-secondary small">Уже есть профиль?</span>
                          <a href="{{ url_for('auth.login') }}" class="text-primary small text-decoration-none ms-1 hover-link">
                              Войти в систему
                          </a>
                      </div>
                  </form>
              </div>
              <div class="col-12 col-lg-7 bg-dark bg-opacity-10 h-100 d-flex align-items-center justify-content-center p-4 p-sm-5 order-1 order-lg-2 border-start border-secondary border-opacity-10">
                  <img src="/static/drinks/guinness.png" class="img-fluid" alt="Регистрация BRS" style="max-height: 400px; object-fit: contain;">
              </div>
          </div>
      </div>
  </div>
{% endblock %}
