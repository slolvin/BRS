{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
      <div class="row justify-content-center w-100">
          <div class="col-12 col-md-8 col-lg-6 col-xl-5">
              {% if error %}
                  <div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger rounded-4 p-3 mb-4 d-flex align-items-center gap-2 small shadow-sm" role="alert">
                      <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                      <div>
                          <strong>Ошибка авторизации:</strong> {{ error }}
                      </div>
                  </div>
              {% endif %}
              <div class="card border-0 rounded-4 shadow bg-body-tertiary p-4 p-sm-5">
                  <div class="card-body p-0">
                      <div class="text-center mb-5">
                          <div class="text-primary fs-1 lh-1 mb-2">
                              <i class="bi bi-layer-forward"></i>
                          </div>
                          <h2 class="h3 fw-bold text-white text-uppercase tracking-wider mb-1">Войти в BRS</h2>
                          <p class="text-secondary small">Введите свои данные для доступа к платформе</p>
                      </div>

                      <form action="{{ url_for('auth.login') }}" method="post" class="row g-4">
                          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                          <div class="col-12">
                              <label for="typeEmail" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Электронная почта</label>
                              <div class="input-group input-group-lg">
                                  <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                      <i class="bi bi-envelope"></i>
                                  </span>
                                  <input name="email" type="email" id="typeEmail"
                                         class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white fs-6"
                                         placeholder="name@example.com" required autocomplete="email">
                              </div>
                          </div>
                          <div class="col-12">
                              <label for="typePassword" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Пароль</label>
                              <div class="input-group input-group-lg">
                                  <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                      <i class="bi bi-lock"></i>
                                  </span>
                                  <input name="password" type="password" id="typePassword"
                                         class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white fs-6"
                                         placeholder="••••••••" required autocomplete="current-password">
                              </div>
                          </div>
                          <label>
                              <input type="checkbox" name="remember_me"> Remember me
                          </label>
                          <div class="col-12 pt-2">
                              <button class="btn btn-primary btn-lg w-100 fw-medium text-uppercase tracking-wide py-3 fs-6 shadow-sm" type="submit">
                                  Войти в систему <i class="bi bi-box-arrow-in-right ms-1"></i>
                              </button>
                          </div>

                          <div class="col-12 text-center mt-4 pt-3 border-top border-secondary border-opacity-10">
                              <span class="text-secondary small">Ещё не зарегистрированы?</span>
                              <a href="{{ url_for('auth.register') }}" class="text-primary small text-decoration-none ms-1 hover-link">
                                  Создать аккаунт
                              </a>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
  </div>
{% endblock %}
