{% extends 'base.html' %}
{% block title %}403 — Доступ ограничен{% endblock %}
{% block content %}
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="text-center" style="max-width: 480px;">

            <!-- Неоновый красный акцент -->
            <div class="display-1 fw-bold text-danger tracking-tighter mb-2">403</div>
            <div class="text-danger opacity-75 fs-1 lh-1 mb-4">
                <i class="bi bi-shield-slash"></i>
            </div>

            <!-- Описание ошибки -->
            <h1 class="h3 fw-bold text-white text-uppercase tracking-wider mb-3">Фейс-контроль не пройден</h1>
            <p class="text-secondary small mb-5 lh-base">
                У вашей учетной записи недостаточно прав, чтобы пройти в этот закрытый зал заведения. Пожалуйста, обратитесь к администратору.
            </p>

            <!-- Кнопки действий -->
            <div class="d-flex gap-2 justify-content-center">
                <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-3 fw-medium text-uppercase tracking-wide rounded-pill">
                    Назад
                </a>
                <a href="/" class="btn btn-primary px-4 py-3 fw-medium text-uppercase tracking-wide shadow-sm rounded-pill">
                    <i class="bi bi-house me-2"></i> На главную
                </a>
            </div>

        </div>
    </div>
{% endblock %}
