{% extends 'base.html' %}
{% block title %}Add new bar{% endblock %}
{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <h1 class="h2 fw-bold text-white mb-0 text-uppercase tracking-wider">Добавить заведение</h1>
                    <div class="flex-grow-1 border-bottom border-secondary border-opacity-10"></div>
                    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-2 fs-7">
                        <i class="bi bi-shop me-1"></i> Новый бар
                    </span>
                </div>
                <div class="card border-0 rounded-4 shadow-sm bg-body-tertiary p-4 p-md-5">
                    <form action="{{ url_for('.add_bar') }}" method="post" enctype="multipart/form-data" class="row g-4">
                        <div class="col-12">
                            <label for="name" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Название бара</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-fonts"></i>
                                </span>
                                <input class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                       type="text" id="name" name="name" placeholder="Например: Craft & Draft"
                                       value="{{ request.form['name'] or '' }}" required>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <label for="city" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Город</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-building"></i>
                                </span>
                                <input class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                       type="text" id="city" name="city" placeholder="Москва"
                                       value="{{ request.form['city'] or '' }}" required>
                            </div>
                        </div>
                        <div class="col-12 col-md-8">
                            <label for="address" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Адрес заведения</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-geo-alt"></i>
                                </span>
                                <input class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                       type="text" id="address" name="address" placeholder="ул. Пушкина, д. 10, стр. 2"
                                       value="{{ request.form['address'] or '' }}" required>
                            </div>
                        </div>
                        <div class="col-12 pt-3 border-top border-secondary border-opacity-10 d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Отмена</a>
                            <button class="btn btn-primary px-5 fw-medium" type="submit">
                                <i class="bi bi-check-lg me-1"></i> Зарегистрировать бар
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
