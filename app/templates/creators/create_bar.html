{% extends 'base.html' %}
{% block title %}Add new bar{% endblock %}
{% block content %}
	<div class="container">
        <form action="{{ url_for('.add_bar') }}" method=post enctype="multipart/form-data">
            <div class="input-group mb-3">
                <input class="form-control" type="text" name="name" placeholder="Name"
                       value="{{ request.form['name'] }}">
            </div>
			<div class="input-group mb-3">
                <input class="form-control" type="text" name="city" placeholder="City"
                       value="{{ request.form['city'] }}">
            </div>
			<div class="input-group mb-3">
                <input class="form-control" type="text" name="address" placeholder="Adress"
                       value="{{ request.form['address'] }}">
            </div>
            <button class="btn btn-primary" type="submit">Submit</button>
        </form>
    </div>
{% endblock %}
