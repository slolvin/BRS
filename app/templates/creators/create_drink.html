{% extends 'base.html' %}
{% block title %}Add new drink{% endblock %}
{% block content %}
    <div class="container py-5">
        <div class="row justify-content-center">
            <!-- Ограничиваем максимальную ширину формы, чтобы она не растягивалась на весь экран ПК -->
            <div class="col-12 col-lg-8">

                <!-- Заголовок страницы -->
                <div class="d-flex align-items-center gap-3 mb-4">
                    <h1 class="h2 fw-bold text-white mb-0 text-uppercase tracking-wider">Добавить напиток</h1>
                    <div class="flex-grow-1 border-bottom border-secondary border-opacity-10"></div>
                    <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 rounded-pill px-3 py-2 fs-7">
                        <i class="bi bi-plus-circle-fill me-1"></i> Новая позиция
                    </span>
                </div>

                <!-- Карточка с формой в нашей фирменной стилистике -->
                <div class="card border-0 rounded-4 shadow-sm bg-body-tertiary p-4 p-md-5">
                    <form action="{{ url_for('.add_drink', bar_id=bar_id) }}" method="post" enctype="multipart/form-data" class="row g-4">
                        <!-- Добавлен скрытый CSRF-токен для защиты POST-запроса во Flask -->
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                        <!-- 1. Название напитка -->
                        <div class="col-12 col-md-7">
                            <label for="name" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Название</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-type"></i>
                                </span>
                                <input class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                       type="text" id="name" name="name" placeholder="Например: Negroni"
                                       value="{{ request.form.get('name', '') }}" required>
                            </div>
                        </div>

                        <!-- 2. Категория/Тип напитка -->
                        <div class="col-12 col-md-5">
                            <label for="type" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Категория</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-funnel"></i>
                                </span>
                                <select class="form-select bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white" id="type" name="type" aria-label="Type">
                                    <option value="Water" {% if request.form.get('type') == 'Water' %}selected{% endif %}>Water</option>
                                    <option value="Beer" {% if request.form.get('type') == 'Beer' %}selected{% endif %}>Beer</option>
                                    <option value="Vodka" {% if request.form.get('type') == 'Vodka' %}selected{% endif %}>Vodka</option>
                                    <option value="Wiskey" {% if request.form.get('type') == 'Wiskey' %}selected{% endif %}>Wiskey</option>
                                    <option value="Cocktail" {% if request.form.get('type') == 'Cocktail' or not request.form.get('type') %}selected{% endif %}>Cocktail</option>
                                </select>
                            </div>
                        </div>

                        <!-- НОВЫЙ БЛОК: ХАРАКТЕРИСТИКИ АЛКОГОЛЯ (ОБЪЕМ И КРЕПОСТЬ) -->
                        <!-- 3. Объём (мл) -->
                        <div class="col-12 col-sm-6">
                            <label for="volume" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Объём напитка (мл)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-droplet"></i>
                                </span>
                                <input class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                       type="number" id="volume" name="volume" min="0" max="5000" step="1" placeholder="Например: 500 или 50"
                                       value="{{ request.form.get('volume', '') }}" required>
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-muted fs-8">мл</span>
                            </div>
                        </div>

                        <!-- 4. Крепость (%) -->
                        <div class="col-12 col-sm-6">
                            <label for="abv" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Крепость / Градус (%)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-secondary">
                                    <i class="bi bi-percent"></i>
                                </span>
                                <input class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                       type="number" id="abv" name="abv" min="0.0" max="100.0" step="0.1" placeholder="Например: 4.5 или 40.0"
                                       value="{{ request.form.get('abv', '') }}" required>
                                <span class="input-group-text bg-dark bg-opacity-50 border-secondary border-opacity-25 text-muted fs-8">% ABV</span>
                            </div>
                        </div>

                        <!-- 5. Загрузка изображения -->
                        <div class="col-12">
                            <label class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Фотография напитка</label>

                            <div class="position-relative border border-dashed border-secondary border-opacity-25 rounded-3 bg-dark bg-opacity-10 p-4 text-center transition-all" id="drop-zone" style="cursor: pointer;">
                                <!-- Скрытый настоящий инпут -->
                                <input type="file" class="position-absolute top-0 start-0 w-100 h-100 opacity-0"
                                       id="image" name="image" accept="image/*" style="cursor: pointer;">

                                <!-- Содержимое по умолчанию -->
                                <div id="drop-zone-prompt" class="py-2">
                                    <i class="bi bi-cloud-arrow-up text-primary fs-3 d-block mb-2"></i>
                                    <span class="text-white d-block small fw-medium">Перетащите фото сюда или кликните для выбора</span>
                                    <span class="form-text text-muted small fs-8">JPEG, PNG, GIF до 5 МБ</span>
                                </div>

                                <!-- Контейнер для превью (появляется после выбора файла) -->
                                <div id="preview-container" class="d-none align-items-center justify-content-between bg-dark bg-opacity-20 rounded p-2 border border-secondary border-opacity-10">
                                    <div class="d-flex align-items-center gap-3 overflow-hidden">
                                        <img id="image-preview" src="#" alt="Preview" class="rounded object-fit-cover" style="width: 50px; height: 50px;">
                                        <div class="text-start overflow-hidden">
                                            <p id="file-name" class="text-white small mb-0 text-truncate fw-medium" style="max-width: 200px;"></p>
                                            <span id="file-size" class="text-muted fs-8"></span>
                                        </div>
                                    </div>
                                    <button type="button" id="remove-image" class="btn btn-sm btn-outline-danger border-0 px-2 py-1">
                                        <i class="bi bi-trash3"></i>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- 6. Описание напитка -->
                        <div class="col-12">
                            <label for="description" class="form-label small text-secondary fw-medium text-uppercase tracking-wider fs-8">Описание и состав</label>
                            <textarea class="form-control bg-dark bg-opacity-20 border-secondary border-opacity-25 text-white"
                                      id="description" name="description" rows="4"
                                      placeholder="Расскажите об ингредиентах, вкусе или подаче напитка...">{{ request.form.get('description', '') }}</textarea>
                        </div>

                        <!-- 5. Кнопки управления -->
                        <div class="col-12 pt-3 border-top border-secondary border-opacity-10 d-flex flex-column-reverse flex-sm-row justify-content-end gap-2">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">Отмена</a>
                            <button class="btn btn-primary px-5 fw-medium" type="submit">
                                <i class="bi bi-check-lg me-1"></i> Сохранить напиток
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
{% block scripts %}
<!-- Маленький скрипт для оживления превью (вставь в конец файла или в блок скриптов) -->
    <script>
        const fileInput = document.getElementById('image');
        const dropZone = document.getElementById('drop-zone');
        const promptZone = document.getElementById('drop-zone-prompt');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const fileName = document.getElementById('file-name');
        const fileSize = document.getElementById('file-size');
        const removeBtn = document.getElementById('remove-image');

        // Подсветка зоны при перетаскивании
        ['dragenter', 'dragover'].forEach(eventName => {
            fileInput.addEventListener(eventName, () => dropZone.classList.add('border-primary', 'bg-opacity-20'), false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            fileInput.addEventListener(eventName, () => dropZone.classList.remove('border-primary', 'bg-opacity-20'), false);
        });

        // Обработка выбора файла
        fileInput.addEventListener('change', function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                fileName.textContent = file.name;
                fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    promptZone.classList.add('d-none');
                    previewContainer.classList.remove('d-none');
                    previewContainer.classList.add('d-flex');
                }
                reader.readAsDataURL(file);
            }
        });

        // Сброс файла
        removeBtn.addEventListener('click', function(e) {
            e.preventDefault();
            fileInput.value = '';
            promptZone.classList.remove('d-none');
            previewContainer.classList.add('d-none');
            previewContainer.classList.remove('d-flex');
        });
    </script>
{% endblock %}
