{% extends 'base.html' %}
{% block title %}404 — Бар не найден{% endblock %}
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="text-center" style="max-width: 480px;">

            <!-- Неоновый акцент и большая иконка -->
            <div class="display-1 fw-bold text-primary tracking-tighter mb-2">404</div>
            <div class="text-warning fs-1 lh-1 mb-4">
                <i class="bi bi-glass-crack"></i>
            </div>

            <!-- Описание ошибки -->
            <h1 class="h3 fw-bold text-white text-uppercase tracking-wider mb-3">Коктейль не найден</h1>
            <p class="text-secondary small mb-5 lh-base">
                Похоже, этой страницы никогда не было в нашем меню, либо бармен случайно стёр её из базы данных. Давайте вернемся на карту.
            </p>

            <!-- Кнопка действия -->
            <a href="/" class="btn btn-primary px-5 py-3 fw-medium text-uppercase tracking-wide shadow-sm rounded-pill">
                <i class="bi bi-arrow-left me-2"></i> На главную
            </a>

        </div>
    </div>
{% block content %}
{% endblock %}
