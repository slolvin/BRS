<div class="card border-0 rounded-4 shadow-sm bg-body-tertiary p-4 mt-4">
    <!-- Кликабельный шапка-заголовок -->
    <div class="d-flex align-items-center justify-content-between cursor-pointer"
         data-bs-toggle="collapse" data-bs-target="#collapseBars" aria-expanded="false" aria-controls="collapseBars"
         style="cursor: pointer;">
        <h3 class="h5 fw-bold text-white mb-0 text-uppercase tracking-wide fs-7">
            <i class="bi bi-chevron-right me-2 small text-secondary"></i>Любимые бары
        </h3>
        <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-pill px-3 py-1 fs-8">
            <i class="bi bi-heart-fill me-1"></i> {{ favorite_bars|length }}
        </span>
    </div>

    <!-- Сворачиваемая зона контента -->
    <div class="collapse" id="collapseBars">
        <div class="row g-3 mt-3">
            {% for bar in favorite_bars %}
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card bg-dark border-secondary border-opacity-10 rounded-3 h-100 p-3 d-flex flex-column justify-content-between">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h4 class="h6 fw-bold text-white mb-0">{{ bar.name }}</h4>
                                <span class="badge bg-warning text-dark small fw-bold">★ {{ bar.rate or '0.0' }}</span>
                            </div>
                            <p class="text-secondary small mb-2">
                                <i class="bi bi-geo-alt-fill me-1 small"></i>{{ bar.get_full_address() or bar.city or 'Адрес не указан' }}
                            </p>
                        </div>

                        <!-- Кнопка перехода к бару -->
                        <div class="mt-3">
                            <a href="{{ url_for('.get_bar_drinks', id=bar.id) }}" class="btn btn-outline-primary btn-sm w-100 py-1.5 fs-8 text-uppercase tracking-wide">
                                Открыть меню <i class="bi bi-arrow-right short ms-1"></i>
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
