{% extends 'base.html' %}

{% block title %}All bars{% endblock %}

{% block content %}
    <div class="container-fluid mb-3">
        <h1 style="color: white">Bars</h1>
    </div>

    <div class="container-fluid px-0 w-100 mb-4">
        <!-- Метод GET идеален для фильтров, убран enctype за ненадобностью -->
        <form action="{{ url_for('.get_bars_list') }}" method="GET" class="row g-3 align-items-end bg-body-tertiary p-3 rounded-4 shadow-sm w-100 m-0">

            <!-- Фильтр по типу напитка -->
            <div class="col-12 col-md-3">
                <label for="type" class="form-label small text-secondary fw-medium">Тип напитка</label>
                <select class="form-select" id="type" name="type">
                    {% if request.args.get('type') == 'any' or not request.args.get('type') %}
                        <option value="any" selected>Все типы</option>
                    {% else %}
                        <option value="any">Все типы</option>
                    {% endif %}

                    {% for option in options %}
                        {% if request.args.get('type') == option %}
                            <option value="{{ option }}" selected>{{ option }}</option>
                        {% else %}
                            <option value="{{ option }}">{{ option }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>

            <!-- Фильтр по расстоянию (заглушка) -->
            <div class="col-12 col-md-2">
                <label for="distance" class="form-label small text-secondary fw-medium">Расстояние</label>
                <select class="form-select" id="distance" name="distance">
                    {% if request.args.get('distance') == 'any' or not request.args.get('distance') %}
                        <option value="any" selected>Любое</option>
                    {% else %}
                        <option value="any">Любое</option>
                    {% endif %}

                    {% if request.args.get('distance') == '500m' %}
                        <option value="500m" selected>Ближе 500 м</option>
                    {% else %}
                        <option value="500m">Ближе 500 м</option>
                    {% endif %}

                    {% if request.args.get('distance') == '1km' %}
                        <option value="1km" selected>В пределах 1 км</option>
                    {% else %}
                        <option value="1km">В пределах 1 км</option>
                    {% endif %}

                    {% if request.args.get('distance') == '5km' %}
                        <option value="5km" selected>До 5 км</option>
                    {% else %}
                        <option value="5km">До 5 км</option>
                    {% endif %}
                </select>
            </div>

            <!-- Фильтр по рейтингу -->
            <div class="col-12 col-md-2">
                <label for="rating" class="form-label small text-secondary fw-medium">Рейтинг</label>
                <select class="form-select" id="rating" name="rating">
                    {% if request.args.get('rating') == 'any' or not request.args.get('rating') %}
                        <option value="any" selected>Любой</option>
                    {% else %}
                        <option value="any">Любой</option>
                    {% endif %}

                    {% if request.args.get('rating') == '4.5' %}
                        <option value="4.5" selected>★ 4.5 и выше</option>
                    {% else %}
                        <option value="4.5">★ 4.5 и выше</option>
                    {% endif %}

                    {% if request.args.get('rating') == '4.0' %}
                        <option value="4.0" selected>★ 4.0 и выше</option>
                    {% else %}
                        <option value="4.0">★ 4.0 и выше</option>
                    {% endif %}

                    {% if request.args.get('rating') == '3.5' %}
                        <option value="3.5" selected>★ 3.5 и выше</option>
                    {% else %}
                        <option value="3.5">★ 3.5 и выше</option>
                    {% endif %}
                </select>
            </div>

            <!-- Фильтр "Открыто сейчас" -->
            <div class="col-6 col-md-2 mb-2 mb-md-0 d-flex align-items-center">
                <div class="form-check">
                    <!-- Рассчитываем наличие атрибута заранее в строке -->
                    {% set is_checked = 'checked' if request.args.get('open_now') == 'true' else '' %}

                    <input class="form-check-input" type="checkbox" id="filter_open_now" name="open_now" value="true" {{ is_checked }}>
                    <label class="form-check-label small" for="filter_open_now">
                        Открыто сейчас
                    </label>
                </div>
            </div>

            <!-- Кнопка отправки -->
            <div class="col-6 col-md-1 d-grid">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-funnel-fill d-md-none me-1"></i> Filter
                </button>
            </div>
        </form>
    </div>

    <!-- Сетка карточек, обернутая в контейнер во избежание горизонтального скролла -->
    <div class="container-fluid mt-4">
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4 justify-content-center">
            {% for bar in bars %}
                <div class="col d-flex">
                    {% include "includes/bars_card.html" %}
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
