{% extends 'base.html' %}
{% block content %}
<h1 xmlns="http://www.w3.org/1999/html">Just placeholder for main page</h1>
    <div class="col col-2">
        <div class="card col-6 offset-3" style="width: 11rem;">
            <div class="card">
                <ol class="list-group list-group-light list-group-numbered">
                </ol>
                <form method="POST" class="text-center">
                    <button class="btn btn-primary" name="claim"/>Claim
                </form>
            </div>
        </div>
    </div>
    <div class="col col-2">
        <h2>Map</h2>
        <img src="https://api-maps.yandex.ru/services/constructor/1.0/static/?um=constructor%3A053bd947d462cc1a45aeba4070defff75501905071c0eaf68436ac9976ec698c&amp;width=500&amp;height=400&amp;lang=ru_RU" alt="Map" style="border: 0;" />
        <p>Давай вот только без смеха, это прототип, а ответственно подходить к API карты и особенно платить за неё я не очень сейчас хочу</p>
    </div>
    <div class="col col-2">
        <form>
          <div class="form-group">
            <label for="inputAddress">Address</label>
            <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
          </div>
          <div class="form-row">
            <div class="form-group col-md-4">
              <label for="inputState">State</label>
              <select id="inputState" class="form-control">
                <option selected>Choose...</option>
                <option>Люк</option>
                <option>Яма</option>
                <option>Повреждение</option>
                <option>Прорыв</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Создать</button>
        </form>
    </div>
{% endblock %}
