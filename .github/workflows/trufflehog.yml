name: Secret Scanning (TruffleHog)
on: [push, pull_request]
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Сканирует всю историю коммитов
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog-main-action@v3.95.5
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
